[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odor_sim"
version = "0.0.1"
description = "Co-simulation of GADEN odor dispersion with robosuite for odor-aware VLA data collection"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# NOTE: heavy sim deps (robosuite, mujoco, lerobot) are installed by
# setup/install_sim_env.sh into a system-site-packages venv (so ROS 2 rclpy is
# visible). They are intentionally NOT hard-pinned here to avoid resolver
# conflicts with the ROS-provided packages. See setup/requirements-sim.txt.
dependencies = [
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["ruff"]
analysis = ["matplotlib", "scipy"]
rlds = [
    "numpy==1.26.4",
    "tensorflow-cpu==2.18.1",
    "tensorflow-datasets==4.9.7",
    "tensorflow-metadata==1.16.1",
    "protobuf>=4.25.2,<6",
    "cffi",
]

[tool.setuptools.package-data]
odor_sim = ["config/*.yaml"]

[tool.setuptools.packages.find]
include = ["odor_sim*"]
exclude = ["gaden*", "ros2_ws*", "simulation*", "scenarios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
